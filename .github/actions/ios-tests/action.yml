name: iOS tests
description: Boots a simulator runtime and runs the Scout test bundle on it.

inputs:
  ios:
    description: Major iOS version to test against.
    required: true
  configuration:
    description: Xcode build configuration to build and test.
    required: true
  device:
    description: Simulator device model to boot.
    required: true
  runtime:
    description: Exact runtime version to download when the runner ships without one.
    required: false
    default: ""

runs:
  using: composite

  steps:
    - name: Prepare simulator
      id: sim
      shell: bash
      env:
        IOS: ${{ inputs.ios }}
        DEVICE: ${{ inputs.device }}
        RUNTIME: ${{ inputs.runtime }}
      run: |
        select_runtime() {
          xcrun simctl list runtimes --json \
            | jq -r --arg v "$IOS." --arg d "$DEVICE" '.runtimes[] | select(.platform == "iOS" and .isAvailable == true and (.version | startswith($v)) and any(.supportedDeviceTypes[]?; .name == $d)) | .identifier' \
            | tail -1
        }
        runtime=$(select_runtime)
        if [ -z "$runtime" ]; then
          if [ -n "$RUNTIME" ]; then
            xcodebuild -downloadPlatform iOS -buildVersion "$RUNTIME"
          else
            xcodebuild -downloadPlatform iOS
          fi
          runtime=$(select_runtime)
        fi
        if [ -z "$runtime" ]; then
          echo "::error::No available iOS $IOS simulator runtime supports $DEVICE."
          xcrun simctl list runtimes
          exit 1
        fi
        udid=$(xcrun simctl list devices available --json \
          | jq -r --arg rt "$runtime" --arg d "$DEVICE" '.devices[$rt][]? | select(.name == $d) | .udid' \
          | head -1)
        if [ -z "$udid" ]; then
          udid=$(xcrun simctl create "$DEVICE" "$DEVICE" "$runtime")
        fi
        echo "udid=$udid" >> "$GITHUB_OUTPUT"

    - name: Cache Swift packages
      uses: ./.github/actions/spm-cache

    - name: Build
      shell: bash
      run: |
        xcodebuild \
          -scheme Scout-Package \
          -configuration ${{ inputs.configuration }} \
          ENABLE_TESTABILITY=YES \
          COPY_PHASE_STRIP=NO \
          -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
          -clonedSourcePackagesDirPath /tmp/spm \
          -skipMacroValidation \
          build-for-testing

    # A failing test and a dead runner both leave xcodebuild with exit 65, so the bundle below tells them apart
    - name: Test
      id: test
      continue-on-error: true
      shell: bash
      run: |
        xcodebuild \
          -scheme Scout-Package \
          -configuration ${{ inputs.configuration }} \
          ENABLE_TESTABILITY=YES \
          COPY_PHASE_STRIP=NO \
          -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
          -clonedSourcePackagesDirPath /tmp/spm \
          -skipMacroValidation \
          -parallel-testing-enabled NO \
          -resultBundlePath /tmp/test.xcresult \
          test-without-building

    - name: Classify the test failure
      id: classify
      if: steps.test.outcome == 'failure'
      shell: bash
      env:
        RESULT: /tmp/test.xcresult
      run: |
        set -eo pipefail
        summary="$(xcrun xcresulttool get test-results summary --path "$RESULT" 2>/dev/null || true)"
        [ -n "$summary" ] || summary='{}'
        failed="$(jq -r '.failedTests // 0' <<< "$summary" 2>/dev/null || echo 0)"
        [[ "$failed" =~ ^[0-9]+$ ]] || failed=0
        echo "Failed tests: $failed"
        if (( failed > 0 )); then
          echo "kind=test" >> "$GITHUB_OUTPUT"
        else
          echo "kind=infrastructure" >> "$GITHUB_OUTPUT"
        fi

    # CI retry reads these two names to tell a red test from a red runner
    - name: Report test failures
      if: steps.classify.outputs.kind == 'test'
      shell: bash
      run: |
        echo "::error::A test failed, so a retry would only repeat it. Fix the test or the code behind it."
        exit 1

    - name: Report an infrastructure failure
      if: steps.classify.outputs.kind == 'infrastructure'
      shell: bash
      run: |
        echo "::error::The test runner stopped without reporting a failed test, so this leg failed on the runner rather than on the code."
        exit 1
