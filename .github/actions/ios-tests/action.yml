name: iOS tests
description: Boots a simulator runtime and runs the Scout test bundle on it.

inputs:
  ios:
    description: Major iOS version to test against.
    required: true
  configuration:
    description: Xcode build configuration to build and test.
    required: true
  device:
    description: Simulator device model to boot.
    required: true
  runtime:
    description: Exact runtime version to download when the runner ships without one.
    required: false
    default: ""

runs:
  using: composite

  steps:
    - name: Prepare simulator
      id: sim
      shell: bash
      env:
        IOS: ${{ inputs.ios }}
        DEVICE: ${{ inputs.device }}
        RUNTIME: ${{ inputs.runtime }}
      run: |
        select_runtime() {
          xcrun simctl list runtimes --json \
            | jq -r --arg v "$IOS." --arg d "$DEVICE" '.runtimes[] | select(.platform == "iOS" and .isAvailable == true and (.version | startswith($v)) and any(.supportedDeviceTypes[]?; .name == $d)) | .identifier' \
            | tail -1
        }
        runtime=$(select_runtime)
        if [ -z "$runtime" ]; then
          if [ -n "$RUNTIME" ]; then
            xcodebuild -downloadPlatform iOS -buildVersion "$RUNTIME"
          else
            xcodebuild -downloadPlatform iOS
          fi
          runtime=$(select_runtime)
        fi
        if [ -z "$runtime" ]; then
          echo "::error::No available iOS $IOS simulator runtime supports $DEVICE."
          xcrun simctl list runtimes
          exit 1
        fi
        udid=$(xcrun simctl list devices available --json \
          | jq -r --arg rt "$runtime" --arg d "$DEVICE" '.devices[$rt][]? | select(.name == $d) | .udid' \
          | head -1)
        if [ -z "$udid" ]; then
          udid=$(xcrun simctl create "$DEVICE" "$DEVICE" "$runtime")
        fi
        echo "udid=$udid" >> "$GITHUB_OUTPUT"

    - name: Cache Swift packages
      uses: ./.github/actions/spm-cache

    - name: Build
      shell: bash
      run: |
        xcodebuild \
          -scheme Scout-Package \
          -configuration ${{ inputs.configuration }} \
          ENABLE_TESTABILITY=YES \
          COPY_PHASE_STRIP=NO \
          -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
          -clonedSourcePackagesDirPath /tmp/spm \
          -skipMacroValidation \
          build-for-testing

    - name: Test
      shell: bash
      run: |
        xcodebuild \
          -scheme Scout-Package \
          -configuration ${{ inputs.configuration }} \
          ENABLE_TESTABILITY=YES \
          COPY_PHASE_STRIP=NO \
          -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
          -clonedSourcePackagesDirPath /tmp/spm \
          -skipMacroValidation \
          -parallel-testing-enabled NO \
          test-without-building
