name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      code: ${{ steps.filter.outputs.code }}
      legs: ${{ steps.legs.outputs.legs }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Detect code changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: .github/scripts/detect-code-changes.sh

      - name: Read the iOS matrix
        id: legs
        run: |
          legs="$(.github/scripts/ios-matrix.sh)"
          echo "$legs"
          echo "legs=$legs" >> "$GITHUB_OUTPUT"

  lint:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: |
          if ! xcrun swift-format lint --strict --recursive Sources Tests; then
            fix="xcrun swift-format format --in-place --recursive Sources Tests"
            echo "::error::swift-format found formatting issues. Fix them locally with: $fix"
            {
              echo "### swift-format failed"
              echo "Run this locally and commit the result:"
              echo '```'
              echo "$fix"
              echo '```'
              echo "Tip: install the pre-commit hook so this is applied automatically on every commit."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  model-versions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Check model version rules
        run: |
          git diff --name-status --no-renames \
            "origin/${{ github.base_ref }}"...HEAD \
            -- Sources/Scout/Persistence/ScoutModel.xcdatamodeld > /tmp/model-changes
          cat /tmp/model-changes

          touched=$(awk -F'\t' '$1 != "A" && $2 !~ /\.xccurrentversion$/' /tmp/model-changes)
          if [ -n "$touched" ]; then
            echo
            echo "Model versions in ScoutModel.xcdatamodeld are immutable once they are on ${{ github.base_ref }}:"
            echo "a store created by a shipped version can only be opened by migrating to a newer one."
            echo "Add a new model version (Xcode: Editor > Add Model Version) instead of editing or deleting these:"
            echo "$touched"
            exit 1
          fi

          added=$(awk -F'\t' '$1 == "A" && $2 ~ /\.xcdatamodel\//' /tmp/model-changes)
          current=$(awk -F'\t' '$2 ~ /\.xccurrentversion$/' /tmp/model-changes)
          if [ -n "$added" ] && [ -z "$current" ]; then
            echo
            echo "A new model version was added, but .xccurrentversion was not updated,"
            echo "so the app would still build against the previous version."
            echo "Mark the new version as current (Xcode: File Inspector > Model Version > Current)."
            exit 1
          fi

          if [ -n "$current" ]; then
            name=$(sed -n 's:.*<string>\(.*\.xcdatamodel\)</string>.*:\1:p' \
              "Sources/Scout/Persistence/ScoutModel.xcdatamodeld/.xccurrentversion")
            if ! grep -qF "$name/" <<< "$added"; then
              echo
              echo ".xccurrentversion now points to \"$name\", which is not a model version added by this change."
              echo "The current version can only move forward to a newly added version:"
              echo "a store migrated to a newer model cannot be opened by an older one."
              exit 1
            fi
          fi

  tests:
    name: test-ios-${{ matrix.ios }} (${{ matrix.configuration }})
    needs: [scope, lint, model-versions]
    if: >-
      ${{ always()
      && needs.scope.outputs.code == 'true'
      && needs.lint.result == 'success'
      && (needs.model-versions.result == 'success' || needs.model-versions.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.legs) }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ios-tests
        with:
          ios: ${{ matrix.ios }}
          configuration: ${{ matrix.configuration }}
          device: ${{ matrix.device }}
          runtime: ${{ matrix.runtime }}
          skip-testing: ${{ matrix.skipTesting }}

  tests-gate:
    name: tests-gate
    needs: [scope, lint, model-versions, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none

      - name: Require the matrix to pass
        run: |
          .github/scripts/require-results.sh "The scope job|${{ needs.scope.result }}"
          if [ "${{ needs.scope.outputs.code }}" != "true" ]; then
            echo "Nothing outside the docs changed; the iOS matrix has nothing to build."
            exit 0
          fi
          .github/scripts/require-results.sh \
            "Lint|${{ needs.lint.result }}" \
            "The model-version check|${{ needs.model-versions.result }}|success,skipped" \
            "The iOS test matrix|${{ needs.tests.result }}"
          echo "Gate passes."

  api-breakage:
    needs: [scope, lint, model-versions]
    if: github.event_name == 'pull_request' && needs.scope.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Read the pull request labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eo pipefail
          labels="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.labels[].name')"
          echo "Labels: $(echo $labels)"
          {
            echo "names<<LABELS"
            echo "$labels"
            echo "LABELS"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Swift package checkouts
        uses: actions/cache@v6
        with:
          path: /tmp/spm
          key: spm-${{ hashFiles('Package.swift') }}
          restore-keys: spm-

      - name: Dump current API
        run: |
          set -eo pipefail
          .github/scripts/build-library-schemes.sh /tmp/dd-current
          .github/scripts/dump-api-set.sh /tmp/dd-current /tmp/current.set

      - name: Identify the toolchain
        id: toolchain
        run: |
          set -eo pipefail
          id="$(xcodebuild -version | tr -d '\n' | tr ' ' '-' | tr -cd 'A-Za-z0-9.-')"
          if [ -z "$id" ]; then
            echo "::error::Could not read the Xcode version for the cache key."
            exit 1
          fi
          echo "Toolchain: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Acknowledge an unbuildable baseline
        id: baseline-ack
        env:
          LABELS: ${{ steps.labels.outputs.names }}
        run: |
          if grep -qxF api-baseline-unbuildable <<< "$LABELS"; then
            echo "The api-baseline-unbuildable label is set, so the base is taken as unable to build" \
              "and the comparison is skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "acknowledged=true" >> "$GITHUB_OUTPUT"
          else
            echo "acknowledged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache baseline API set
        id: baseline-cache
        if: steps.baseline-ack.outputs.acknowledged != 'true'
        uses: actions/cache@v6
        with:
          path: /tmp/baseline.set
          key: api-baseline-set-${{ github.event.pull_request.base.sha }}-${{ hashFiles('.github/scripts/dump-api-set.sh', '.github/scripts/build-library-schemes.sh') }}-${{ steps.toolchain.outputs.id }}

      - name: Dump baseline API
        if: steps.baseline-ack.outputs.acknowledged != 'true' && steps.baseline-cache.outputs.cache-hit != 'true'
        run: |
          baseline="${{ github.event.pull_request.base.sha }}"
          if [ -z "$baseline" ]; then
            echo "::error::The pull request exposes no base revision to compare against."
            exit 1
          fi
          echo "Comparing against base $baseline"
          git worktree add /tmp/baseline "$baseline"
          cd /tmp/baseline
          if ! "$GITHUB_WORKSPACE/.github/scripts/build-library-schemes.sh" /tmp/dd-baseline; then
            echo "::error::The baseline does not build, so the API comparison cannot run. Dependencies resolve fresh here, so a dependency release can break a base that once built — fix the base or pin the dependency. Where the PR is itself that fix, add the api-baseline-unbuildable label to say the base cannot answer."
            exit 1
          fi
          "$GITHUB_WORKSPACE/.github/scripts/dump-api-set.sh" /tmp/dd-baseline /tmp/baseline.set

      - name: Compare
        if: steps.baseline-ack.outputs.acknowledged != 'true'
        env:
          LABELS: ${{ steps.labels.outputs.names }}
        run: |
          if [ ! -f /tmp/baseline.set ]; then
            echo "::error::No baseline API set was produced, so the comparison cannot run."
            exit 1
          fi
          if [ ! -s /tmp/baseline.set ]; then
            echo "::error::The baseline API set is empty, which means the dump produced nothing rather than that the base vends no API."
            exit 1
          fi
          removed="$(comm -23 /tmp/baseline.set /tmp/current.set || true)"
          if [ -z "$removed" ]; then
            echo "No public API was removed against the base branch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### API removed against the base branch"
            echo '```'
            echo "$removed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$removed"
          if grep -qxF api-breaking <<< "$LABELS"; then
            echo
            echo "The api-breaking label is set, treating the break as intentional."
            exit 0
          fi
          echo
          echo "This PR removes API that existing integrations may depend on, which"
          echo "requires a major release. If the break is intentional, add the"
          echo "api-breaking label to this PR and re-run this job to acknowledge it."
          exit 1

  api-gate:
    name: api-gate
    needs: [scope, lint, model-versions, api-breakage]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none

      - name: Require the API diff to pass
        run: |
          .github/scripts/require-results.sh "The scope job|${{ needs.scope.result }}"
          if [ "${{ needs.scope.outputs.code }}" != "true" ]; then
            echo "Nothing outside the docs changed; the public API cannot have moved."
            exit 0
          fi
          .github/scripts/require-results.sh \
            "Lint|${{ needs.lint.result }}" \
            "The model-version check|${{ needs.model-versions.result }}" \
            "The API breakage check|${{ needs.api-breakage.result }}"
          echo "Gate passes."
