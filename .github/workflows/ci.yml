name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      code: ${{ steps.filter.outputs.code }}
      api: ${{ steps.api-filter.outputs.api }}
      legs: ${{ steps.legs.outputs.legs }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Detect code changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PATTERN: ^(Sources/|Tests/|Package(@swift-[0-9.]+)?\.swift$|\.swift-format$|\.github/)
          OUTPUT: code
        run: .github/scripts/detect-changes.sh

      - name: Detect public API changes
        id: api-filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PATTERN: ^(Sources/|Package(@swift-[0-9.]+)?\.swift$|\.github/)
          OUTPUT: api
        run: .github/scripts/detect-changes.sh

      - name: Read the iOS matrix
        id: legs
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
            schedule | workflow_dispatch) filter='.configuration = ["Release"]' ;;
            *) filter='.configuration = ["Debug"]' ;;
          esac
          legs="$(jq -c "$filter" .github/matrix/ios.json)"
          echo "$legs"
          echo "legs=$legs" >> "$GITHUB_OUTPUT"

  lint:
    needs: scope
    if: needs.scope.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: macos-26
    timeout-minutes: 5

    # swift-format ships with Xcode: pin it so a runner image update cannot change the formatting rules
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - uses: actions/checkout@v7

      - name: Check the pinned Xcode
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::The runner has no $DEVELOPER_DIR. Pin the lint job to an Xcode from the macos-26 image readme in actions/runner-images."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          xcodebuild -version
          version="$(xcrun swift-format --version)"
          echo "swift-format $version"

      - name: Lint
        run: |
          if ! xcrun swift-format lint --strict --recursive Sources Tests; then
            xcode="$(xcodebuild -version | head -n 1)"
            fix="xcrun swift-format format --in-place --recursive Sources Tests"
            echo "::error::swift-format from $xcode found formatting issues. Fix them locally with $xcode: $fix"
            {
              echo "### swift-format failed"
              echo "Run this locally with $xcode and commit the result:"
              echo '```'
              echo "$fix"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  model-versions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Check model version rules
        run: |
          dir=Sources/Scout/Persistence/ScoutModel.xcdatamodeld
          git diff --name-status --no-renames \
            "origin/${{ github.base_ref }}"...HEAD \
            -- "$dir" > /tmp/model-changes
          cat /tmp/model-changes

          touched=$(awk -F'\t' '$1 != "A" && $2 !~ /\.xccurrentversion$/' /tmp/model-changes)
          if [ -n "$touched" ]; then
            echo
            echo "Model versions in ScoutModel.xcdatamodeld are immutable once they are on ${{ github.base_ref }}:"
            echo "a store created by a shipped version can only be opened by migrating to a newer one."
            echo "Add a new model version (Xcode: Editor > Add Model Version) instead of editing or deleting these:"
            echo "$touched"
            exit 1
          fi

          current=$(awk -F'\t' -v path="$dir/.xccurrentversion" '$2 == path { print $1 }' /tmp/model-changes)
          if [ "$current" = D ]; then
            echo
            echo ".xccurrentversion was deleted or renamed. It names the model version the app builds against."
            echo "Restore it and point it to the newest model version (Xcode: File Inspector > Model Version > Current)."
            exit 1
          fi

          added=$(awk -F'\t' '$1 == "A" { print $2 }' /tmp/model-changes |
            sed -n 's:.*/\([^/]*\.xcdatamodel\)/.*:\1:p' | sort -u)
          if [ -n "$added" ] && [ -z "$current" ]; then
            echo
            echo "A new model version was added, but .xccurrentversion was not updated,"
            echo "so the app would still build against the previous version."
            echo "Mark the new version as current (Xcode: File Inspector > Model Version > Current)."
            exit 1
          fi

          if [ -n "$current" ]; then
            name=$(sed -n 's:.*<string>\(.*\.xcdatamodel\)</string>.*:\1:p' "$dir/.xccurrentversion")
            if [ -z "$name" ] || ! grep -qxF "$name" <<< "$added"; then
              echo
              echo ".xccurrentversion now points to \"$name\", which is not a model version added by this change."
              echo "The current version can only move forward to a newly added version:"
              echo "a store migrated to a newer model cannot be opened by an older one."
              exit 1
            fi

            newest=$(sort -t ' ' -k 2,2n <<< "$added" | tail -n 1)
            if [ "$name" != "$newest" ]; then
              echo
              echo ".xccurrentversion points to \"$name\", but this change also adds the newer \"$newest\"."
              echo "Mark the newest added version as current, or remove the versions above \"$name\":"
              echo "once on ${{ github.base_ref }}, a version is immutable, so a version that no build uses stays dead."
              exit 1
            fi
          fi

  tests:
    name: test-ios-${{ matrix.ios }} (${{ matrix.configuration }})
    needs: [scope, lint, model-versions]
    # !cancelled(), not always(): a cancelled run re-checks this condition and stops the legs only when it is false
    if: >-
      ${{ !cancelled()
      && needs.scope.outputs.code == 'true'
      && needs.lint.result == 'success'
      && (needs.model-versions.result == 'success' || needs.model-versions.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # A leg on a public-preview image shows red when it fails but leaves needs.tests.result at success
    continue-on-error: ${{ matrix.preview == true }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.legs) }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ios-tests
        with:
          ios: ${{ matrix.ios }}
          configuration: ${{ matrix.configuration }}
          device: ${{ matrix.device }}
          runtime: ${{ matrix.runtime }}

  tests-gate:
    name: tests-gate
    needs: [scope, lint, model-versions, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none

      - name: Require the matrix to pass
        run: |
          .github/scripts/require-results.sh "The scope job|${{ needs.scope.result }}"
          if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "Draft pull request; the iOS matrix runs once it is ready for review."
            exit 0
          fi
          if [ "${{ needs.scope.outputs.code }}" != "true" ]; then
            echo "Nothing outside the docs changed; the iOS matrix has nothing to build."
            exit 0
          fi
          preview="$(jq -r '[.include[] | select(.preview == true) | "iOS \(.ios)"] | join(", ")' .github/matrix/ios.json)"
          if [ -n "$preview" ]; then
            echo "$preview runs on a preview image, so a red leg there does not fail this gate."
          fi
          .github/scripts/require-results.sh \
            "Lint|${{ needs.lint.result }}" \
            "The model-version check|${{ needs.model-versions.result }}|success,skipped" \
            "The iOS test matrix|${{ needs.tests.result }}"
          echo "Gate passes."

  notify:
    needs: tests
    # always() keeps the model-versions job, skipped on push, from skipping this one through tests
    if: >-
      ${{ always()
      && github.event_name == 'push'
      && github.repository == 'kasianov-mikhail/scout'
      && needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger scout-ip
        run: |
          curl --fail-with-body -sS \
            --retry 3 --retry-all-errors --retry-delay 5 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kasianov-mikhail/scout-ip/dispatches \
            -d '{"event_type":"scout-updated"}'

  api-baseline:
    needs: scope
    if: github.event_name == 'push' && needs.scope.outputs.api == 'true'
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Cache Swift packages
        id: spm
        uses: ./.github/actions/spm-cache

      - name: Key the API dump
        id: key
        env:
          TOOLCHAIN: ${{ steps.spm.outputs.toolchain }}
        run: |
          key="$(.github/scripts/api-baseline-key.sh HEAD "$TOOLCHAIN")"
          echo "Key: $key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Look up a saved dump
        id: saved
        uses: actions/cache/restore@v6
        with:
          path: /tmp/baseline.json
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Dump the API
        if: steps.saved.outputs.cache-hit != 'true'
        run: |
          set -eo pipefail
          .github/scripts/build-library-schemes.sh /tmp/dd
          .github/scripts/dump-api.sh /tmp/dd /tmp/baseline.json

      # Saved from main, the dump is the baseline of every pull request whose base has the same sources.
      - name: Save the dump
        if: steps.saved.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/baseline.json
          key: ${{ steps.key.outputs.key }}

  api-breakage:
    needs: [scope, lint, model-versions]
    if: github.event_name == 'pull_request' && needs.scope.outputs.api == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Read the pull request labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eo pipefail
          labels="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.labels[].name')"
          echo "Labels: $(echo $labels)"
          {
            echo "names<<LABELS"
            echo "$labels"
            echo "LABELS"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Swift packages
        id: spm
        uses: ./.github/actions/spm-cache

      - name: Dump current API
        run: |
          set -eo pipefail
          .github/scripts/build-library-schemes.sh /tmp/dd-current
          .github/scripts/dump-api.sh /tmp/dd-current /tmp/current.json

      - name: Acknowledge an unbuildable baseline
        id: baseline-ack
        env:
          LABELS: ${{ steps.labels.outputs.names }}
        run: |
          if grep -qxF api-baseline-unbuildable <<< "$LABELS"; then
            echo "The api-baseline-unbuildable label is set, so the base is taken as unable to build" \
              "and the comparison is skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "acknowledged=true" >> "$GITHUB_OUTPUT"
          else
            echo "acknowledged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Key the baseline API
        id: baseline-key
        if: steps.baseline-ack.outputs.acknowledged != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TOOLCHAIN: ${{ steps.spm.outputs.toolchain }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "::error::The pull request exposes no base revision to compare against."
            exit 1
          fi
          key="$(.github/scripts/api-baseline-key.sh "$BASE_SHA" "$TOOLCHAIN")"
          echo "Key: $key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore the baseline API
        id: baseline-cache
        if: steps.baseline-ack.outputs.acknowledged != 'true'
        uses: actions/cache/restore@v6
        with:
          path: /tmp/baseline.json
          key: ${{ steps.baseline-key.outputs.key }}

      - name: Dump baseline API
        if: steps.baseline-ack.outputs.acknowledged != 'true' && steps.baseline-cache.outputs.cache-hit != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "Comparing against base $BASE_SHA"
          git worktree add /tmp/baseline "$BASE_SHA"
          cd /tmp/baseline
          if ! "$GITHUB_WORKSPACE/.github/scripts/build-library-schemes.sh" /tmp/dd-baseline; then
            echo "::error::The baseline does not build, so the API comparison cannot run. Dependencies resolve fresh here, so a dependency release can break a base that once built — fix the base or pin the dependency. Where the PR is itself that fix, add the api-baseline-unbuildable label to say the base cannot answer."
            exit 1
          fi
          "$GITHUB_WORKSPACE/.github/scripts/dump-api.sh" /tmp/dd-baseline /tmp/baseline.json

      - name: Save the baseline API
        if: steps.baseline-ack.outputs.acknowledged != 'true' && steps.baseline-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/baseline.json
          key: ${{ steps.baseline-key.outputs.key }}

      - name: Compare
        if: steps.baseline-ack.outputs.acknowledged != 'true'
        env:
          LABELS: ${{ steps.labels.outputs.names }}
        run: |
          if [ ! -f /tmp/baseline.json ]; then
            echo "::error::No baseline API dump was produced, so the comparison cannot run."
            exit 1
          fi
          breaks="$(.github/scripts/diff-api.sh /tmp/baseline.json /tmp/current.json)"
          if [ -z "$breaks" ]; then
            exit 0
          fi
          {
            echo "### API broken against the base branch"
            echo '```'
            echo "$breaks"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$breaks"
          if grep -qxF api-breaking <<< "$LABELS"; then
            echo
            echo "The api-breaking label is set, treating the break as intentional."
            exit 0
          fi
          echo
          echo "This PR removes or changes API that existing integrations may depend on, which"
          echo "requires a major release. If the break is intentional, add the"
          echo "api-breaking label to this PR and re-run this job to acknowledge it."
          exit 1

  api-gate:
    name: api-gate
    needs: [scope, lint, model-versions, api-breakage]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none

      - name: Require the API diff to pass
        run: |
          .github/scripts/require-results.sh "The scope job|${{ needs.scope.result }}"
          if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "Draft pull request; the API diff runs once it is ready for review."
            exit 0
          fi
          if [ "${{ needs.scope.outputs.code }}" != "true" ]; then
            echo "Nothing outside the docs changed; the public API cannot have moved."
            exit 0
          fi
          .github/scripts/require-results.sh \
            "Lint|${{ needs.lint.result }}" \
            "The model-version check|${{ needs.model-versions.result }}"
          if [ "${{ needs.scope.outputs.api }}" != "true" ]; then
            echo "No source or manifest changed; the public API cannot have moved."
            exit 0
          fi
          .github/scripts/require-results.sh \
            "The API breakage check|${{ needs.api-breakage.result }}"
          echo "Gate passes."
