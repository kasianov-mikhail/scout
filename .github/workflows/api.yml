name: API

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    uses: ./.github/workflows/scope.yml

  gate:
    name: gate
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 190

    permissions:
      contents: read
      checks: read
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none

      - name: Wait for the fast checks
        env:
          GH_TOKEN: ${{ github.token }}
          SHAS: ${{ github.event.pull_request.head.sha }} ${{ github.sha }}
          CHECKS: lint model-versions changes
        run: .github/scripts/wait-for-checks.sh

  api-breakage:
    needs: gate
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Cache Swift package checkouts
        uses: actions/cache@v6
        with:
          path: /tmp/spm
          key: spm-${{ hashFiles('Package.swift') }}
          restore-keys: spm-

      - name: Dump current API
        run: |
          set -eo pipefail
          schemes="$(swift package dump-package | jq -r '.products[] | select(.type.library) | .name')"
          if [ -z "$schemes" ]; then
            echo "::error::No library products found in the manifest."
            exit 1
          fi
          for scheme in $schemes; do
            xcodebuild \
              -scheme "$scheme" \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath /tmp/dd-current \
              -clonedSourcePackagesDirPath /tmp/spm \
              -skipMacroValidation \
              -quiet \
              build
          done
          .github/scripts/dump-api-set.sh /tmp/dd-current /tmp/current.set

      - name: Identify the toolchain
        id: toolchain
        run: |
          set -eo pipefail
          id="$(xcodebuild -version | tr -d '\n' | tr ' ' '-' | tr -cd 'A-Za-z0-9.-')"
          if [ -z "$id" ]; then
            echo "::error::Could not read the Xcode version for the cache key."
            exit 1
          fi
          echo "Toolchain: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Acknowledge an unbuildable baseline
        id: baseline-ack
        run: |
          if ${{ contains(github.event.pull_request.labels.*.name, 'api-baseline-unbuildable') }}; then
            echo "The api-baseline-unbuildable label is set, so the base is taken as unable to build" \
              "and the comparison is skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "acknowledged=true" >> "$GITHUB_OUTPUT"
          else
            echo "acknowledged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache baseline API set
        id: baseline-cache
        if: steps.baseline-ack.outputs.acknowledged != 'true'
        uses: actions/cache@v6
        with:
          path: /tmp/baseline.set
          key: api-baseline-set-${{ github.event.pull_request.base.sha }}-${{ hashFiles('.github/scripts/dump-api-set.sh') }}-${{ steps.toolchain.outputs.id }}

      - name: Dump baseline API
        if: steps.baseline-ack.outputs.acknowledged != 'true' && steps.baseline-cache.outputs.cache-hit != 'true'
        run: |
          baseline="${{ github.event.pull_request.base.sha }}"
          if [ -z "$baseline" ]; then
            echo "::error::The pull request exposes no base revision to compare against."
            exit 1
          fi
          echo "Comparing against base $baseline"
          git worktree add /tmp/baseline "$baseline"
          cd /tmp/baseline
          schemes="$(swift package dump-package | jq -r '.products[] | select(.type.library) | .name')"
          if [ -z "$schemes" ]; then
            echo "::error::The baseline manifest vends no library products, so there is no API to compare against."
            exit 1
          fi
          for scheme in $schemes; do
            if ! xcodebuild \
              -scheme "$scheme" \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath /tmp/dd-baseline \
              -clonedSourcePackagesDirPath /tmp/spm \
              -skipMacroValidation \
              -quiet \
              build; then
              echo "::error::The baseline scheme $scheme does not build, so the API comparison cannot run. Dependencies resolve fresh here, so a dependency release can break a base that once built — fix the base or pin the dependency. Where the PR is itself that fix, add the api-baseline-unbuildable label to say the base cannot answer."
              exit 1
            fi
          done
          "$GITHUB_WORKSPACE/.github/scripts/dump-api-set.sh" /tmp/dd-baseline /tmp/baseline.set

      - name: Compare
        if: steps.baseline-ack.outputs.acknowledged != 'true'
        run: |
          if [ ! -f /tmp/baseline.set ]; then
            echo "::error::No baseline API set was produced, so the comparison cannot run."
            exit 1
          fi
          if [ ! -s /tmp/baseline.set ]; then
            echo "::error::The baseline API set is empty, which means the dump produced nothing rather than that the base vends no API."
            exit 1
          fi
          removed="$(comm -23 /tmp/baseline.set /tmp/current.set || true)"
          if [ -z "$removed" ]; then
            echo "No public API was removed against the base branch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### API removed against the base branch"
            echo '```'
            echo "$removed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$removed"
          if ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking') }}; then
            echo
            echo "The api-breaking label is set, treating the break as intentional."
            exit 0
          fi
          echo
          echo "This PR removes API that existing integrations may depend on, which"
          echo "requires a major release. If the break is intentional, add the"
          echo "api-breaking label to this PR to acknowledge it."
          exit 1

  api-gate:
    name: api-gate
    needs: [scope, gate, api-breakage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none

      - name: Require the API diff to pass
        run: |
          .github/scripts/require-results.sh "The scope job|${{ needs.scope.result }}"
          if [ "${{ needs.scope.outputs.code }}" != "true" ]; then
            echo "Nothing outside the docs changed; the public API cannot have moved."
            exit 0
          fi
          .github/scripts/require-results.sh \
            "The fast-check gate|${{ needs.gate.result }}" \
            "The API breakage check|${{ needs.api-breakage.result }}"
          echo "Gate passes."
