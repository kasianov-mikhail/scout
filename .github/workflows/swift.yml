name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scope:
    uses: ./.github/workflows/scope.yml

  lint:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: |
          if ! xcrun swift-format lint --strict --recursive Sources Tests; then
            fix="xcrun swift-format format --in-place --recursive Sources Tests"
            echo "::error::swift-format found formatting issues. Fix them locally with: $fix"
            {
              echo "### swift-format failed"
              echo "Run this locally and commit the result:"
              echo '```'
              echo "$fix"
              echo '```'
              echo "Tip: install the pre-commit hook so this is applied automatically on every commit."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  gate:
    name: gate
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 190

    permissions:
      contents: read
      checks: read
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none

      - name: Wait for the fast cross-workflow checks
        env:
          GH_TOKEN: ${{ github.token }}
          SHAS: ${{ github.event.pull_request.head.sha }} ${{ github.sha }}
          CHECKS: model-versions changes
        run: .github/scripts/wait-for-checks.sh

  matrix:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      legs: ${{ steps.legs.outputs.legs }}

    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none

      - name: Narrow the iOS matrix
        id: legs
        # Temporarily narrowed to iOS 26 Debug; drop the arguments to restore the full matrix from
        # .github/matrix/ios.json. Until then that full matrix keeps running nightly in
        # .github/workflows/nightly.yml, which reports when every leg is green again.
        # Optimized builds specialize generics and fold key paths, so SwiftData predicate traps and
        # other release-only failures never show up in a Debug-only run.
        run: |
          legs="$(.github/scripts/ios-matrix.sh --ios 26 --configuration Debug)"
          echo "$legs"
          echo "legs=$legs" >> "$GITHUB_OUTPUT"

  tests:
    name: test-ios-${{ matrix.ios }} (${{ matrix.configuration }})
    needs: [scope, lint, gate, matrix]
    if: >-
      ${{ always()
      && needs.scope.outputs.code == 'true'
      && needs.lint.result == 'success'
      && needs.matrix.result == 'success'
      && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.legs) }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ios-tests
        with:
          ios: ${{ matrix.ios }}
          configuration: ${{ matrix.configuration }}
          device: ${{ matrix.device }}
          runtime: ${{ matrix.runtime }}
          skip-testing: ${{ matrix.skipTesting }}

  tests-gate:
    name: tests-gate
    needs: [scope, lint, gate, matrix, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none

      - name: Require the matrix to pass
        run: |
          .github/scripts/require-results.sh "The scope job|${{ needs.scope.result }}"
          if [ "${{ needs.scope.outputs.code }}" != "true" ]; then
            echo "Nothing outside the docs changed; the iOS matrix has nothing to build."
            exit 0
          fi
          .github/scripts/require-results.sh \
            "Lint|${{ needs.lint.result }}" \
            "The fast-check gate|${{ needs.gate.result }}|success,skipped" \
            "The matrix job|${{ needs.matrix.result }}" \
            "The iOS test matrix|${{ needs.tests.result }}"
          echo "Gate passes."
