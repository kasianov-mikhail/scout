name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Detect code changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: .github/scripts/detect-code-changes.sh

  lint:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: |
          if ! xcrun swift-format lint --strict --recursive Sources Tests; then
            fix="xcrun swift-format format --in-place --recursive Sources Tests"
            echo "::error::swift-format found formatting issues. Fix them locally with: $fix"
            {
              echo "### swift-format failed"
              echo "Run this locally and commit the result:"
              echo '```'
              echo "$fix"
              echo '```'
              echo "Tip: install the pre-commit hook so this is applied automatically on every commit."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  gate:
    name: gate
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 190

    permissions:
      contents: read
      checks: read

    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none

      - name: Wait for the fast cross-workflow checks
        env:
          GH_TOKEN: ${{ github.token }}
          SHAS: ${{ github.event.pull_request.head.sha }} ${{ github.sha }}
          CHECKS: model-versions changes
        run: .github/scripts/wait-for-checks.sh

  tests:
    name: test-ios-${{ matrix.ios }} (${{ matrix.configuration }})
    needs: [scope, lint, gate]
    if: >-
      ${{ always()
      && needs.scope.outputs.code == 'true'
      && needs.lint.result == 'success'
      && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Optimized builds specialize generics and fold key paths, so SwiftData predicate traps and
        # other release-only failures never show up in a Debug-only run.
        configuration: [Debug, Release]
        ios: [16, 17, 18, 26, 27]
        include:
          - ios: 16
            os: macos-15
            device: iPhone 14
            runtime: "16.4"
            skipTesting: LookupIndexTests
          - ios: 17
            os: macos-15
            device: iPhone 15
            runtime: "17.5"
          - ios: 18
            os: macos-15
            device: iPhone 16
          - ios: 26
            os: macos-26
            device: iPhone 17
          - ios: 27
            os: xcode-27
            device: iPhone 17
          - ios: 26
            configuration: Debug
            coverage: true

    steps:
      - uses: actions/checkout@v7

      - name: Prepare simulator
        id: sim
        run: |
          if ! xcrun simctl list runtimes | grep -q "^iOS ${{ matrix.ios }}\."; then
            if [ -n "${{ matrix.runtime }}" ]; then
              xcodebuild -downloadPlatform iOS -buildVersion "${{ matrix.runtime }}"
            else
              xcodebuild -downloadPlatform iOS
            fi
          fi
          runtime=$(xcrun simctl list runtimes --json \
            | jq -r '.runtimes[] | select(.platform == "iOS" and (.version | startswith("${{ matrix.ios }}."))) | .identifier' \
            | tail -1)
          if [ -z "$runtime" ]; then
            echo "No iOS ${{ matrix.ios }} simulator runtime is available."
            xcrun simctl list runtimes
            exit 1
          fi
          udid=$(xcrun simctl list devices available --json \
            | jq -r --arg rt "$runtime" '.devices[$rt][]? | select(.name == "${{ matrix.device }}") | .udid' \
            | head -1)
          if [ -z "$udid" ]; then
            udid=$(xcrun simctl create "${{ matrix.device }}" "${{ matrix.device }}" "$runtime")
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Cache Swift package checkouts
        uses: actions/cache@v6
        with:
          path: /tmp/spm
          key: spm-${{ hashFiles('Package.swift') }}
          restore-keys: spm-

      - name: Build
        run: |
          xcodebuild \
            -scheme Scout-Package \
            -configuration ${{ matrix.configuration }} \
            ENABLE_TESTABILITY=YES \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -clonedSourcePackagesDirPath /tmp/spm \
            -enableCodeCoverage ${{ matrix.coverage && 'YES' || 'NO' }} \
            -skipMacroValidation \
            build-for-testing

      - name: Test
        run: |
          xcodebuild \
            -scheme Scout-Package \
            -configuration ${{ matrix.configuration }} \
            ENABLE_TESTABILITY=YES \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -clonedSourcePackagesDirPath /tmp/spm \
            -enableCodeCoverage ${{ matrix.coverage && 'YES' || 'NO' }} \
            -skipMacroValidation \
            ${{ matrix.skipTesting && format('-skip-testing:{0}', matrix.skipTesting) || '' }} \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            test-without-building

      - name: Report coverage
        if: matrix.coverage
        run: |
          {
            echo "### Coverage (iOS ${{ matrix.ios }})"
            echo '```'
            xcrun xccov view --report --only-targets TestResults.xcresult
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  tests-gate:
    name: tests-gate
    needs: [scope, lint, gate, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none

      - name: Require the matrix to pass
        run: |
          .github/scripts/require-results.sh "The scope job|${{ needs.scope.result }}"
          if [ "${{ needs.scope.outputs.code }}" != "true" ]; then
            echo "Nothing outside the docs changed; the iOS matrix has nothing to build."
            exit 0
          fi
          .github/scripts/require-results.sh \
            "Lint|${{ needs.lint.result }}" \
            "The fast-check gate|${{ needs.gate.result }}|success,skipped" \
            "The iOS test matrix|${{ needs.tests.result }}"
          echo "Gate passes."
