name: Server

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [scout-server-updated]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PATTERN: ^(Sources/Connectors/Hosted/|Sources/Scout/Database/|Tests/Connectors/Hosted/|\.github/workflows/server\.yml$|\.github/scripts/)

concurrency:
  group: server-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Guard the filter covers the wire code
        run: .github/scripts/guard-filter-covers-wire.sh

      - name: Detect wire-surface changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          OUTPUT: backend
        run: .github/scripts/detect-changes.sh

  contract:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: kasianov-mikhail/scout-server
          path: scout-server

      - name: Start PostgreSQL
        run: .github/scripts/start-postgres.sh

      - name: Start scout-server
        run: .github/scripts/start-scout-server.sh

      - name: Run contract tests
        env:
          TEST_RUNNER_SCOUT_SERVER_URL: http://127.0.0.1:8080
        run: |
          xcodebuild \
            -scheme Scout-Package \
            -destination 'platform=macOS' \
            -skipMacroValidation \
            -only-testing:HostedConnectorTests/ServerContractTests \
            -resultBundlePath TestResults.xcresult \
            test

      - name: Verify the contract suite ran
        run: .github/scripts/verify-contract-ran.sh

      - name: Dump server log
        if: failure()
        run: test ! -f scout-server/server.log || cat scout-server/server.log

  contract-gate:
    name: contract-gate
    needs: [changes, contract]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none

      - name: Require the contract to pass (or be N/A)
        run: |
          .github/scripts/require-results.sh \
            "The changes job|${{ needs.changes.result }}" \
            "The contract check|${{ needs.contract.result }}|success,skipped"
          echo "Gate passes."
